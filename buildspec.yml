# AWS CodeBuild — imajı build edip ECR'a gönderir, CodePipeline'ın
# ECS deploy aşaması için imagedefinitions.json üretir.
#
# CodeBuild projesinde gerekli ayarlar:
#   - Privileged mode: AÇIK (Docker build için)
#   - Ortam değişkeni IMAGE_REPO_NAME (varsayılan: wordpress-shop-demo)
#   - Servis rolünde ECR push izinleri
version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: wordpress-shop-demo
    CONTAINER_NAME: wordpress   # ECS task definition'daki konteyner adıyla aynı olmalı

phases:
  pre_build:
    commands:
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - echo "Build:$IMAGE_TAG -> $ECR_URI"
  build:
    commands:
      - docker build -t $ECR_URI:$IMAGE_TAG -t $ECR_URI:latest .
  post_build:
    commands:
      - docker push $ECR_URI:$IMAGE_TAG
      - docker push $ECR_URI:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$ECR_URI:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
